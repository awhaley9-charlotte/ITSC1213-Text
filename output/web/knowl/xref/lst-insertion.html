<figure class="listing figure-like"><figcaption><span class="type">Listing</span><span class="space"> </span><span class="codenumber">7.9.3<span class="period">.</span></span><span class="space"> </span><div class="autopermalink" data-description="Listing 7.9.3"><a href="#lst-insertion" title="Copy heading and permalink for Listing 7.9.3">🔗</a></div></figcaption><div class="listing__contents"><div class="ptx-runestone-container"><div class="runestone explainer ac_section "><div data-component="activecode" id="rs-lst-insertion"><textarea data-lang="python" data-audio="" data-coach="true" style="visibility: hidden;" id="rs-lst-insertion_editor" data-question_label="" data-codelens="true" data-timelimit="25000">def insertion_sort(a_list):
    for i in range(1, len(a_list)):
        cur_val = a_list[i]
        cur_pos = i

        while cur_pos &gt; 0 and a_list[cur_pos - 1] &gt; cur_val:
            a_list[cur_pos] = a_list[cur_pos - 1]
            cur_pos = cur_pos - 1
        a_list[cur_pos] = cur_val


a_list = [54, 26, 93, 17, 77, 31, 44, 55, 20]
insertion_sort(a_list)
print(a_list)
