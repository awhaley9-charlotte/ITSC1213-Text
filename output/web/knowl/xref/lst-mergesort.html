<figure class="listing figure-like"><figcaption><span class="type">Listing</span><span class="space"> </span><span class="codenumber">7.11.3<span class="period">.</span></span><span class="space"> </span><div class="autopermalink" data-description="Listing 7.11.3"><a href="#lst-mergesort" title="Copy heading and permalink for Listing 7.11.3">🔗</a></div></figcaption><div class="listing__contents"><div class="ptx-runestone-container"><div class="runestone explainer ac_section "><div data-component="activecode" id="rs-lst-mergesort"><textarea data-lang="python" data-audio="" data-coach="true" style="visibility: hidden;" id="rs-lst-mergesort_editor" data-question_label="" data-codelens="true" data-timelimit="25000">def merge_sort(a_list):
    print("Splitting", a_list)
    if len(a_list) &gt; 1:
        mid = len(a_list) // 2
        left_half = a_list[:mid]
        right_half = a_list[mid:]

        merge_sort(left_half)
        merge_sort(right_half)

        i, j, k = 0, 0, 0
        while i &lt; len(left_half) and j &lt; len(right_half):
            if left_half[i] &lt;= right_half[j]:
                a_list[k] = left_half[i]
                i = i + 1
            else:
                a_list[k] = right_half[j]
                j = j + 1
            k = k + 1

        while i &lt; len(left_half):
            a_list[k] = left_half[i]
            i = i + 1
            k = k + 1

        while j &lt; len(right_half):
            a_list[k] = right_half[j]
            j = j + 1
            k = k + 1
    print("Merging", a_list)


a_list = [54, 26, 93, 17, 77, 31, 44, 55, 20]
merge_sort(a_list)
print(a_list)
