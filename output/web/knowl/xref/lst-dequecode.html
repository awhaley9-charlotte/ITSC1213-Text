<figure class="listing figure-like"><figcaption><span class="type">Listing</span><span class="space"> </span><span class="codenumber">1.17.1<span class="period">.</span></span><span class="space"> </span><div class="autopermalink" data-description="Listing 1.17.1"><a href="#lst-dequecode" title="Copy heading and permalink for Listing 1.17.1">🔗</a></div></figcaption><div class="listing__contents"><div class="code-box"><pre class="program"><code id="rs-lst-dequecode" class="language-py">class Deque:
    """Deque implementation as a list"""

    def __init__(self):
        """Create new deque"""
        self._items = []

    def is_empty(self):
        """Check if the deque is empty"""
        return not bool(self._items)

    def add_front(self, item):
        """Add an item to the front of the deque"""
        self._items.append(item)

    def add_rear(self, item):
        """Add an item to the rear of the deque"""
        self._items.insert(0, item)

    def remove_front(self):
        """Remove an item from the front of the deque"""
        return self._items.pop()

    def remove_rear(self):
        """Remove an item from the rear of the deque"""
        return self._items.pop(0)

    def size(self):
        """Get the number of items in the deque"""
        return len(self._items)
